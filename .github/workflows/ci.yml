name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # lib/ 随仓库提交（从 GitHub 装的人不再构建一遍），所以它必须和 src 对得上。
      - name: lib/ is in sync with src/
        run: git diff --exit-code -- lib
